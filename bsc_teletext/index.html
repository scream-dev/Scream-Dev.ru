<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050505" />
  <title>BS // TELETEXT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --panel-border: #1a1a1a;
      --summary-color: #ffb000;
      --summary-accent: #00ff66;
      --ticker-color: #6e8878;
      --muted: #444444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100dvh;
      background-color: var(--bg);
      color: var(--summary-color);
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-bottom: 1px solid var(--panel-border);
      font-size: 11px;
      background: #080808;
      flex-shrink: 0;
    }

    .status-wrap { display: flex; align-items: center; gap: 6px; }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff3333;
    }

    .dot.online {
      background: var(--summary-accent);
      box-shadow: 0 0 6px var(--summary-accent);
    }

    button {
      background: #0d0d0d;
      color: #888;
      border: 1px solid #262626;
      padding: 3px 7px;
      font-family: inherit;
      font-size: 10px;
      border-radius: 3px;
      cursor: pointer;
    }

    button.active {
      color: var(--summary-accent);
      border-color: #1f5c35;
      background: #081a0f;
    }

    #summaries {
      flex: 55;
      overflow-y: auto;
      padding: 10px;
      border-bottom: 2px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .summary-card {
      background: #0a0a0a;
      border-left: 3px solid var(--summary-color);
      padding: 8px 10px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--summary-color);
      white-space: pre-wrap;
    }

    .summary-time {
      font-size: 10px;
      color: var(--summary-accent);
      margin-bottom: 4px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    #ticker {
      flex: 45;
      overflow-y: auto;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      scroll-behavior: smooth;
    }

    .ticker-line {
      font-size: 11.5px;
      line-height: 1.35;
      color: var(--ticker-color);
      word-break: break-word;
    }

    .ticker-time {
      color: var(--muted);
      margin-right: 6px;
      font-size: 10px;
    }

    #summaries::-webkit-scrollbar,
    #ticker::-webkit-scrollbar { width: 3px; }
    #summaries::-webkit-scrollbar-thumb,
    #ticker::-webkit-scrollbar-thumb { background: #1f1f1f; }
  </style>
</head>
<body>

  <header>
    <div class="status-wrap">
      <div id="statusDot" class="dot"></div>
      <span id="statusText">CONNECTING...</span>
    </div>
    <button id="wakeBtn">WAKE: OFF</button>
  </header>

  <section id="summaries"></section>
  <section id="ticker"></section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import {
      getDatabase,
      ref,
      query,
      limitToLast,
      onChildAdded,
      onValue
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

    const firebaseConfig = {
     apiKey: "AIzaSyAztsNLVs9nElrvQtCZQA2ZF-jCUuPasZc",
     authDomain: "screamdev-ca68a.firebaseapp.com",
     databaseURL: "https://screamdev-ca68a-default-rtdb.firebaseio.com",
     projectId: "screamdev-ca68a",
     storageBucket: "screamdev-ca68a.firebasestorage.app",
     messagingSenderId: "513024079698",
     appId: "1:513024079698:web:912302891a5927df61ac8b",
     measurementId: "G-W1N63CWZX9"

    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const summariesEl = document.getElementById('summaries');
    const tickerEl = document.getElementById('ticker');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const wakeBtn = document.getElementById('wakeBtn');

    function isNearBottom(el, threshold = 60) {
      return el.scrollHeight - el.scrollTop - el.clientHeight <= threshold;
    }

    function appendSummary(item) {
      const shouldScroll = isNearBottom(summariesEl);
      const card = document.createElement('div');
      card.className = 'summary-card';

      const timeEl = document.createElement('div');
      timeEl.className = 'summary-time';
      timeEl.textContent = `[${item.timestamp || '--:--:--'}] РАУНД-АПДЕЙТ`;

      const bodyEl = document.createElement('div');
      bodyEl.textContent = item.text || '';

      card.appendChild(timeEl);
      card.appendChild(bodyEl);
      summariesEl.appendChild(card);

      while (summariesEl.children.length > 30) {
        summariesEl.removeChild(summariesEl.firstChild);
      }

      if (shouldScroll) {
        summariesEl.scrollTop = summariesEl.scrollHeight;
      }
    }

    function appendRawLog(item) {
      const shouldScroll = isNearBottom(tickerEl);
      const line = document.createElement('div');
      line.className = 'ticker-line';

      const timeSpan = document.createElement('span');
      timeSpan.className = 'ticker-time';
      timeSpan.textContent = item.timestamp || '';

      const textNode = document.createTextNode(item.text || '');

      line.appendChild(timeSpan);
      line.appendChild(textNode);
      tickerEl.appendChild(line);

      while (tickerEl.children.length > 80) {
        tickerEl.removeChild(tickerEl.firstChild);
      }

      if (shouldScroll) {
        tickerEl.scrollTop = tickerEl.scrollHeight;
      }
    }

    // Индикатор реального статуса соединения с Firebase
    onValue(ref(db, ".info/connected"), (snap) => {
      if (snap.val() === true) {
        statusDot.classList.add('online');
        statusText.textContent = 'LIVE';
      } else {
        statusDot.classList.remove('online');
        statusText.textContent = 'RECONNECTING...';
      }
    });

    // Подписка на последние 15 саммари + новые в реальном времени
    const summariesQuery = query(ref(db, 'teletext/summaries'), limitToLast(15));
    onChildAdded(summariesQuery, (snapshot) => {
      const data = snapshot.val();
      if (data) appendSummary(data);
    });

    // Подписка на последние 50 строк транскрипта + новые в реальном времени
    const rawQuery = query(ref(db, 'teletext/raw'), limitToLast(50));
    onChildAdded(rawQuery, (snapshot) => {
      const data = snapshot.val();
      if (data) appendRawLog(data);
    });

    // Wake Lock API
    let wakeLock = null;

    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) {
        wakeBtn.textContent = 'WAKE: N/A';
        return;
      }
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeBtn.classList.add('active');
        wakeBtn.textContent = 'WAKE: ON';
        wakeLock.addEventListener('release', () => {
          wakeBtn.classList.remove('active');
          wakeBtn.textContent = 'WAKE: OFF';
        });
      } catch {
        wakeBtn.classList.remove('active');
        wakeBtn.textContent = 'WAKE: ERR';
      }
    }

    wakeBtn.addEventListener('click', async () => {
      if (wakeLock !== null && !wakeLock.released) {
        await wakeLock.release();
        wakeLock = null;
      } else {
        await requestWakeLock();
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && wakeBtn.classList.contains('active')) {
        requestWakeLock();
      }
    });
  </script>
</body>
</html>
